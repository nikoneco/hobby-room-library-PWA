name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - index.html
      - '*.js'
      - appsscript.json
      - .claspignore
      - script.*.js.html
      - style.*.css.html
      - tools/build-pages.js
      - tools/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build Pages artifact
        run: node tools/build-pages.js

      - name: Check project identity
        run: node tools/check-project-identity.js

      - name: Check client JavaScript
        run: node tools/check-client-js.js

      - name: Check client request races
        run: node tools/check-client-races.js

      - name: Check book detail request lifecycle
        run: node tools/check-book-detail-transport.js

      - name: Check library revision fallback
        run: node tools/check-library-revision-hedge.js

      - name: Check revision frame client transport
        run: node tools/check-library-revision-frame.js

      - name: Check revision frame server transport
        run: node tools/check-revision-frame-server.js

      - name: Check public API frame client transport
        run: node tools/check-public-api-frame.js

      - name: Check public API frame server transport
        run: node tools/check-public-api-frame-server.js

      - name: Check generated fallback covers
        run: node tools/check-fallback-covers.js

      - name: Check contributors and preview counts
        run: node tools/check-contributors-preview.js

      - name: Check similar book ranking
        run: node tools/check-similar-books.js

      - name: Check client CSS
        run: node tools/check-client-css.js

      - name: Check Pages artifact
        run: node tools/check-pages.js

      - name: Check GAS API surface
        run: node tools/check-server-api.js

      - name: Check import enrichment retries
        run: node tools/check-import-retries.js

      - name: Check series registry lifecycle
        run: node tools/check-series-registry.js

      - name: Check series display order
        run: node tools/check-series-order.js

      - name: Check series loading and request lifecycle
        run: node tools/check-series-loading.js

      - name: Check series API performance metadata
        run: node tools/check-series-perf.js

      - name: Check cold library rebuild compatibility
        run: node tools/check-cold-optimization.js

      - name: Check spreadsheet mode transitions
        run: node tools/check-sheet-modes.js

      - name: Check public GAS JSONP surface
        run: node tools/check-gas-public-surface.js

      - name: Check local search index
        run: node tools/check-local-index.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
